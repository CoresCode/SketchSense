<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SketchSense — draw it, we'll name it</title>
    <meta
      name="description"
      content="A convolutional network that reads your doodles, running entirely in your browser. Trained on Google QuickDraw, exported to ONNX, no server involved."
    />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="SketchSense" />
    <meta
      property="og:description"
      content="Draw it. A CNN guesses it. 100 classes, inference in your browser."
    />
    <meta property="og:type" content="website" />
    <!-- Absolute URLs: Slack and LinkedIn will not resolve a relative og:image. If the host
         moves (custom domain, renamed workers.dev subdomain), update these two plus og:url. -->
    <meta property="og:url" content="https://sketchsense.corescode.workers.dev/" />
    <meta
      property="og:image"
      content="https://sketchsense.corescode.workers.dev/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://sketchsense.corescode.workers.dev/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
